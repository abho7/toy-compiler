name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No dependencies to install: the compiler, the interpreters, the VM and
      # the test harness are all plain ES modules in this repository.
      - run: node --test
